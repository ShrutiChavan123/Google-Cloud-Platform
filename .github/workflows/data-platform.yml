name: Data platform CI/CD

on:
  pull_request:
    branches:
      - master
    paths:
      - "BigQuery/**"
      - "DataProc/**"
      - "dags/**"
      - "scripts/**"
      - ".github/workflows/data-platform.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate changed files
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_changed_assets.py "$BASE_SHA" "$HEAD_SHA"
      
      - name: Validate changed DML batch and execution order
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/dml_batch.py validate "$BASE_SHA" "$HEAD_SHA"

  deploy-dev:
    name: Deploy changed assets to development
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install BigQuery client
        run: python -m pip install google-cloud-bigquery

      - name: Deploy changed BigQuery SQL
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python scripts/deploy_bigquery.py "$BASE_SHA" "$HEAD_SHA"

      - name: Deploy changed DML in validated order
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: python scripts/dml_batch.py deploy "$BASE_SHA" "$HEAD_SHA"

      # - name: Deploy changed BigQuery SQL
      #   env:
