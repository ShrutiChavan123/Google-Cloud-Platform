      #           < "$file"
      #       done
      #     }

      #     deploy_category dataset
      #     deploy_category table
      #     deploy_category view
      #     deploy_category routine

      - name: Upload changed DAG files
        if: ${{ hashFiles('dags/**/*.py') != '' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMPOSER_DAGS_BUCKET: ${{ vars.COMPOSER_DAGS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$COMPOSER_DAGS_BUCKET" ]]; then
            echo "::error::Set COMPOSER_DAGS_BUCKET before deploying DAGs."
            exit 1
          fi

          mapfile -t changed_dags < <(
            git diff --name-only --diff-filter=ACMR \
              "$BASE_SHA...$HEAD_SHA" -- dags |
              grep -E '\.py$' || true
          )

          for file in "${changed_dags[@]}"; do
            destination="gs://${COMPOSER_DAGS_BUCKET}/dags/${file#dags/}"
            echo "Uploading $file to $destination"
            gcloud storage cp "$file" "$destination"
          done

