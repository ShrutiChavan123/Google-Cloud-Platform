      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     mapfile -t changed_sql < <(
      #       git diff --name-only --diff-filter=ACMR \
      #         "$BASE_SHA...$HEAD_SHA" -- BigQuery |
      #         grep -E '\.sql$' || true
      #     )

      #     deploy_category() {
      #       local category="$1"
      #       local file

      #       for file in "${changed_sql[@]}"; do
      #         case "$category:$file" in
      #           dataset:BigQuery/DATASETS/*.sql) ;;
      #           table:BigQuery/*/TABLES/*.sql) ;;
      #           view:BigQuery/*/VIEWS/*.sql) ;;
      #           routine:BigQuery/*/ROUTINES/*.sql) ;;
      #           *) continue ;;
      #         esac

      #         echo "Deploying $file to ${GCP_PROJECT_ID}"
      #         bq query \
      #           --project_id="$GCP_PROJECT_ID" \
