name: Data platform CI/CD

on:
  pull_request:
    paths:
      - "BigQuery/**"
      - "DataProc/**"
      - "dags/**"
      - "scripts/**"
      - ".github/workflows/data-platform.yml"
  push:
    branches:
      - master
    paths:
      - "BigQuery/**"
      - "DataProc/**"
      - "dags/**"
      - "scripts/**"
      - ".github/workflows/data-platform.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate changed files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_changed_assets.py "$BASE_SHA" "$HEAD_SHA"

  deploy-dev:
    name: Deploy changed assets to development
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy changed BigQuery assets
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GCP_PROJECT_ID" ]]; then
            echo "::error::Set the GCP_PROJECT_ID environment variable."
            exit 1
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Cannot determine changed files for this initial push. Merge a follow-up change to deploy."
            exit 1
          fi

          mapfile -t changed_sql < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- BigQuery |
              grep -E '\.sql$' || true
          )

          deploy_category() {
            local category="$1"
            local file

            for file in "${changed_sql[@]}"; do
              case "$category:$file" in
                dataset:BigQuery/DATASETS/*.sql) ;;
                table:BigQuery/*/TABLES/*.sql) ;;
                view:BigQuery/*/VIEWS/*.sql) ;;
                routine:BigQuery/*/ROUTINES/*.sql) ;;
                *) continue ;;
              esac

              echo "Deploying $file"
              bq query \
                --project_id="$GCP_PROJECT_ID" \
                --use_legacy_sql=false \
                < "$file"
            done
          }

          deploy_category dataset
          deploy_category table
          deploy_category view
          deploy_category routine

      - name: Sync Composer DAGs when present
        if: ${{ hashFiles('dags/**/*.py') != '' }}
        env:
          COMPOSER_DAGS_BUCKET: ${{ vars.COMPOSER_DAGS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$COMPOSER_DAGS_BUCKET" ]]; then
            echo "::error::Set COMPOSER_DAGS_BUCKET before deploying DAGs."
            exit 1
          fi

          gcloud storage rsync --recursive dags "gs://${COMPOSER_DAGS_BUCKET}"